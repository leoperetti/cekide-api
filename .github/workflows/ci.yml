name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore cekide-api.slnx
      - name: Test
        run: dotnet test cekide-api.slnx --no-restore --configuration Release
      - name: Test runner SQL firewall lifecycle offline
        shell: pwsh
        run: ./scripts/deployment/Test-RunnerSqlFirewall.ps1
