name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CekideCI#2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CekideCI#2026' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore cekide-api.slnx
      - name: Test
        env:
          CEKIDE_TEST_SQL_CONNECTION: "Server=localhost;Database=cekide_attendance_test_ci;User Id=sa;******;TrustServerCertificate=True;Encrypt=True"
        run: dotnet test cekide-api.slnx --no-restore --configuration Release
      - name: Test runner SQL firewall lifecycle offline
        shell: pwsh
        run: ./scripts/deployment/Test-RunnerSqlFirewall.ps1
