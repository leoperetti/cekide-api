name: SQL connectivity diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-connectivity-diagnostic
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: azure/login@v2
        id: login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Temporarily allow this runner IP
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ip = (Invoke-RestMethod -Uri 'https://api.ipify.org' -TimeoutSec 30).Trim()
          $address = $null
          if (-not [System.Net.IPAddress]::TryParse($ip, [ref]$address) -or
              $address.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork -or
              $ip -eq '0.0.0.0') { throw 'Expected a nonzero runner IPv4 address.' }
          az sql server firewall-rule create --subscription $env:AZURE_SUBSCRIPTION_ID -g CEKIDE -s cekide -n "gha-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-staging" --start-ip-address $ip --end-ip-address $ip --only-show-errors -o none
          if ($LASTEXITCODE -ne 0) { throw 'Failed to allow the runner IP.' }
      - name: Validate staging SQL access and cross-environment denial
        run: dotnet run --project scripts/diagnostics/SqlConnectivity/SqlConnectivity.csproj --configuration Release -- staging
      - name: Remove this runner firewall rule
        if: always() && steps.login.outcome == 'success'
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          az sql server firewall-rule delete --subscription $env:AZURE_SUBSCRIPTION_ID -g CEKIDE -s cekide -n "gha-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-staging" --only-show-errors -o none
          if ($LASTEXITCODE -ne 0) { throw 'Runner firewall cleanup failed; remove the rule manually.' }

  production:
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: azure/login@v2
        id: login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Temporarily allow this runner IP
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ip = (Invoke-RestMethod -Uri 'https://api.ipify.org' -TimeoutSec 30).Trim()
          $address = $null
          if (-not [System.Net.IPAddress]::TryParse($ip, [ref]$address) -or
              $address.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork -or
              $ip -eq '0.0.0.0') { throw 'Expected a nonzero runner IPv4 address.' }
          az sql server firewall-rule create --subscription $env:AZURE_SUBSCRIPTION_ID -g CEKIDE -s cekide -n "gha-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-production" --start-ip-address $ip --end-ip-address $ip --only-show-errors -o none
          if ($LASTEXITCODE -ne 0) { throw 'Failed to allow the runner IP.' }
      - name: Validate production SQL access and cross-environment denial
        run: dotnet run --project scripts/diagnostics/SqlConnectivity/SqlConnectivity.csproj --configuration Release -- production
      - name: Remove this runner firewall rule
        if: always() && steps.login.outcome == 'success'
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          az sql server firewall-rule delete --subscription $env:AZURE_SUBSCRIPTION_ID -g CEKIDE -s cekide -n "gha-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-production" --only-show-errors -o none
          if ($LASTEXITCODE -ne 0) { throw 'Runner firewall cleanup failed; remove the rule manually.' }
